# dsh-reconnect (local adaptation) bundle patch: insert the reconnect row.
#
# Host half (src/index.js):
#   - listens on the `agent/request-error` waterfall (fired on every failed
#     model request, after llm-retry's normal policy is exhausted and when a
#     Provider `always` policy delegates recovery downstream);
#   - transient codes retry indefinitely; unknown codes are bounded by
#     unknownMaxRetries when retryUnknown is false; QUOTA is not retried by
#     default; permanent codes stop immediately; model-availability waits for
#     configuration recovery;
#   - exponential backoff 1s, 2s, 4s ... capped at maxDelayMs (60s);
#     a positive provider Retry-After is honored as a floor.
#   - cancel: turn abort, plugin stop, or hot reload drains active retries.
#
# Upstream MistRain-1/dsh-reconnect 2.0.0 declared this same row inside a
# `version:`-nested patch file its README described; this file uses the
# current `insert:` dialect the 0.2.0-rc.2 loader applies.
- insert:
    - id: reconnect
      name: dsh-reconnect
      config:
        retryUnknown: false
        unknownMaxRetries: 10
        retryQuota: false
        maxDelayMs: 60000
