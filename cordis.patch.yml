# dsh-reconnect 补丁:向 profile 插入 reconnect 行。
#
# Host half (src/index.js):
#   - 监听 `agent/request-error` 瀑布事件(每次模型请求失败都会触发);
#   - 内置 llm-retry 在 normal Provider 策略耗尽后由本插件接管标准临时错误和未知错误;
#     Provider 的 always 策略把恢复决定委托给下游,由本插件处理可恢复错误;
#   - 标准临时错误、模型不存在/未配置错误和默认未知错误无限重试,QUOTA 默认不重试;
#   - 指数退避:1s → 2s → 4s → ... 封顶 60s;服务端 Retry-After 作为最短等待直接尊重;
#   - 回合中止、插件销毁或热重载时立即取消等待,不会留下悬挂 Promise。
- insert:
    - id: reconnect
      name: 'dsh-reconnect'
      config:
        maxDelayMs: 60000
        retryQuota: false
        retryUnknown: true
        unknownMaxRetries: 3
